[tool.uv.workspace]
members = ["backend"]

[tool.uv.sources]
booksprite = { workspace = true }

[dependency-groups]
dev = [
    "booksprite",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["booksprite"]
