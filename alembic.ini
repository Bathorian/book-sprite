[alembic]
script_location = %(here)s/backend/migrations
# Migrations are numbered 0001, 0002, ... (see backend/migrations/env.py).
file_template = %%(rev)s_%%(slug)s
# The database URL comes from BookSprite settings (BOOKSPRITE_DATA_DIR).
# Run env.py for every `revision` command so manual migrations get numbered too.
revision_environment = true
